<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EBA2"/>
      <stop offset="100%" stop-color="#BDC56E"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212125"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark: High-Tech Labs Emblem Container -->
  <g id="icon-mark" transform="translate(30, 20)">
    <!-- Base Bento Capsule -->
    <rect x="0" y="0" width="180" height="180" rx="44" fill="url(#darkBg)" stroke="#2B2B30" stroke-width="2"/>

    <!-- Subtle Technical Blueprint Grid Lines -->
    <line x1="90" y1="24" x2="90" y2="156" stroke="#222226" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="24" y1="90" x2="156" y2="90" stroke="#222226" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Central Research Lab & Byte Monogram (Synthesis of Flask + Code Brackets + Data Core) -->
    <!-- Stylized Flask Neck & Rim in Pure Clean White -->
    <path d="M 78 44 L 102 44" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M 84 44 L 84 62 L 62 104 C 54 118 64 136 80 136 L 100 136 C 116 136 126 118 118 104 L 96 62 L 96 44" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Dynamic Labs Code Angle Bracket Slash Core in Brand Lime -->
    <!-- The Left Code Bracket < -->
    <path d="M 76 86 L 68 98 L 76 110" fill="none" stroke="url(#limeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- The Right Code Bracket > -->
    <path d="M 104 86 L 112 98 L 104 110" fill="none" stroke="url(#limeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating Quantum Byte Node / Synthesis Catalyst -->
    <circle cx="90" cy="98" r="5" fill="#FFFFFF"/>
    <circle cx="90" cy="120" r="4" fill="url(#limeGrad)"/>
    <circle cx="78" cy="122" r="3" fill="#D2D88F" opacity="0.8"/>
    <circle cx="102" cy="122" r="3" fill="#D2D88F" opacity="0.8"/>

    <!-- Modern Orbit ring around beaker base (Atom / Experiment) -->
    <ellipse cx="90" cy="136" rx="38" ry="10" fill="none" stroke="url(#limeGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>
  </g>

  <!-- Typography Suite: OpenByte Labs -->
  <g id="brand-typography" transform="translate(245, 60)">
    <!-- Primary Line: OPENBYTE -->
    <text x="0" y="52" 
          font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" 
          font-size="48" 
          font-weight="800" 
          letter-spacing="-0.03em" 
          fill="#18181A">
      OPEN<tspan fill="#18181A" font-weight="400">BYTE</tspan>
    </text>

    <!-- Labs Badge Pill / Accent Wordmark -->
    <g transform="translate(276, 14)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="104" height="42" rx="12" fill="#18181A"/>
      <!-- Glowing Tech Dot -->
      <circle cx="20" cy="21" r="4.5" fill="#D2D88F"/>
      <!-- Text LABS -->
      <text x="34" y="27" 
            font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" 
            font-size="18" 
            font-weight="700" 
            letter-spacing="0.15em" 
            fill="#FFFFFF">
        LABS
      </text>
    </g>

    <!-- Subtitle / Mission Tagline -->
    <text x="2" y="90" 
          font-family="'SF Pro Text', 'Inter', -apple-system, sans-serif" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="0.25em" 
          fill="#71717A">
      RESEARCH &amp; SOFTWARE INNOVATION
    </text>

    <!-- Technical Spec / Specifier Line Indicator -->
    <g transform="translate(2, 110)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#18181A" stroke-width="2"/>
      <line x1="44" y1="0" x2="76" y2="0" stroke="#D2D88F" stroke-width="2.5"/>
      <text x="88" y="3.5" font-family="'SF Pro Text', 'Inter', monospace" font-size="9.5" font-weight="600" fill="#9CA3AF" letter-spacing="0.12em">ADVANCED ENGINEERING R&amp;D</text>
    </g>
  </g>
</svg>