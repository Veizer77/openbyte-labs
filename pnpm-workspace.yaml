allowBuilds:
  esbuild: true
  unrs-resolver: true

# @esbuild-kit/core-utils is no longer maintained and pins a vulnerable
# esbuild 0.18.x. Its loader uses the stable transform/build APIs in 0.25.x.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@sentry/bundler-plugins>glob': 14.0.2
  'glob>minimatch': 11.0.1
