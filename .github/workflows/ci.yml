name: Fondasi PRD 1.5

on:
  pull_request:
  push:
    branches: [main, refactor/prd-v1-5-reset]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://127.0.0.1:3105
      BETTER_AUTH_URL: http://127.0.0.1:3105
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      DATABASE_URI: postgres://test:test@127.0.0.1:1/openbyte_test
      DATABASE_URI_DIRECT: postgres://test:test@127.0.0.1:1/openbyte_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:portability
      - run: pnpm test
      - run: pnpm check:access
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level=high
