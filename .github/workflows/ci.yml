name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: https://openbyte-ci.invalid
      BETTER_AUTH_URL: https://openbyte-ci.invalid
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
      DATABASE_URI: postgresql://ci:placeholder@db.openbyte-ci.invalid/openbyte_test?sslmode=require
      IP_HASH_SALT: ci-only-placeholder-salt-not-for-deployment
      TURNSTILE_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:portability
      - run: pnpm test
      - run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dijalankan hanya lewat workflow_dispatch sampai database uji di CI
  # diverifikasi. Tidak memblokir quality gate pada push/pull request.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openbyte_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: https://openbyte-ci.invalid
      BETTER_AUTH_URL: https://openbyte-ci.invalid
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
      IP_HASH_SALT: ci-only-placeholder-salt-not-for-deployment
      DATABASE_URI: postgresql://ci:placeholder@db.openbyte-ci.invalid/openbyte_ci?sslmode=require
      TURNSTILE_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openbyte_test
      TEST_DATABASE_TARGET: localhost:5432/openbyte_test
      TEST_DATABASE_WRITE_CONFIRM: I_CONFIRM_ISOLATED_TEST_DATABASE
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:test -- --confirm-keyword=MIGRATE-TEST
      - run: pnpm db:seed:foundation -- --confirm-target=openbyte_test --confirm-keyword=SEED
      - run: pnpm test:integration
