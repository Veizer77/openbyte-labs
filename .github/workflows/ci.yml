name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/openbyte_test
      DATABASE_URI_DIRECT: postgres://postgres:postgres@localhost:5432/openbyte_test
      PAYLOAD_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      R2_ACCOUNT_ID: ci-account
      R2_ACCESS_KEY_ID: ci-access-key
      R2_SECRET_ACCESS_KEY: ci-secret-key
      R2_BUCKET_PUBLIC: ci-public-bucket
      R2_PUBLIC_BASE_URL: https://assets.example.invalid
      IP_HASH_SALT: ci-only-salt
      TRUSTED_IP_HEADER: x-forwarded-for
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:access
      - run: pnpm check:portability
      - run: pnpm generate:types
      - run: git diff --exit-code -- src/payload-types.ts
      - run: pnpm migrate
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level=high
