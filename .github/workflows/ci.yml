name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: https://openbyte-ci.invalid
      BETTER_AUTH_URL: https://openbyte-ci.invalid
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
      DATABASE_URI: postgresql://ci:placeholder@db.openbyte-ci.invalid/openbyte_test?sslmode=require
      IP_HASH_SALT: ci-only-placeholder-salt-not-for-deployment
      TURNSTILE_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:portability
      - run: pnpm test
      - run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
