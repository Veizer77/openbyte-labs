name: Backup manual (verifikasi ulang PRD 1.5)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URI_DIRECT: ${{ secrets.DATABASE_URI_DIRECT }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PG_MAJOR: ${{ vars.PG_MAJOR }}
      BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Validasi konfigurasi tanpa mencetak rahasia
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URI_DIRECT BACKUP_PASSPHRASE PG_MAJOR BACKUP_R2_BUCKET R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!key:-}" ]; then echo "Konfigurasi wajib belum tersedia: $key"; exit 1; fi
          done
          [[ "$PG_MAJOR" =~ ^[0-9]+$ ]]
      - name: Dump dan enkripsi
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f backup.dump' EXIT
          docker run --rm -e DATABASE_URI_DIRECT "postgres:${PG_MAJOR}" sh -c 'exec pg_dump --format=custom --no-owner "$DATABASE_URI_DIRECT"' > backup.dump
          test -s backup.dump
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "backup-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg" backup.dump
      - name: Unggah berkas terenkripsi ke bucket cadangan
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp backup-*.dump.gpg "s3://${BACKUP_R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
