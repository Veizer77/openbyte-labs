name: Backup harian

# PRD H.6: pg_dump versi mayor sama dengan Neon, enkripsi AES256, unggah ke
# bucket R2 terpisah. Cron 02:17 WIB; GitHub bisa menonaktifkan workflow
# terjadwal di repositori publik yang tidak aktif — periksa tab Actions
# sekali sebulan. Secrets/vars yang wajib diisi pemilik:
#   secrets: DATABASE_URI_DIRECT, BACKUP_PASSPHRASE, BACKUP_R2_ACCESS_KEY_ID,
#            BACKUP_R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID
#   vars:    PG_MAJOR (17, sesuai Neon), BACKUP_R2_BUCKET
on:
  schedule:
    - cron: '17 19 * * *' # 02:17 WIB (GitHub memakai UTC)
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump (versi mayor sama dengan Neon)
        env:
          DATABASE_URI_DIRECT: ${{ secrets.DATABASE_URI_DIRECT }}
          PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
        run: |
          if [ -z "$DATABASE_URI_DIRECT" ]; then
            echo "Secret DATABASE_URI_DIRECT belum diisi; backup dilewati."
            exit 1
          fi
          docker run --rm "postgres:${PG_MAJOR}" pg_dump --format=custom --no-owner "$DATABASE_URI_DIRECT" > backup.dump

      - name: Enkripsi
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Secret BACKUP_PASSPHRASE belum diisi; backup dilewati."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "backup-$(date -u +%F).dump.gpg" backup.dump
          rm backup.dump

      - name: Unggah ke bucket R2 terpisah
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$BACKUP_R2_BUCKET" ]; then
            echo "Var BACKUP_R2_BUCKET belum diisi; backup dilewati."
            exit 1
          fi
          aws s3 cp backup-*.dump.gpg "s3://${BACKUP_R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

  # Pemulihan teruji (PRD H.6 catatan): unduh, dekripsi, pg_restore ke database
  # kosong, lalu pastikan tabel Payload ada. Jalankan manual dari tab Actions.
  restore-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Unduh cadangan terbaru dari bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          LATEST=$(aws s3 ls "s3://${BACKUP_R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | sort | tail -n 1 | awk '{print $4}')
          if [ -z "$LATEST" ]; then
            echo "Bucket cadangan kosong; tidak ada yang bisa dipulihkan."
            exit 1
          fi
          echo "Memulihkan $LATEST"
          aws s3 cp "s3://${BACKUP_R2_BUCKET}/${LATEST}" backup.dump.gpg --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Dekripsi
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --decrypt -o backup.dump backup.dump.gpg

      - name: pg_restore ke database kosong
        env:
          PGPASSWORD: postgres
          PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
        run: |
          docker run --rm -v "$(pwd)":/w "postgres:${PG_MAJOR}" \
            pg_restore --no-owner --dbname "postgres://postgres:postgres@host.docker.internal:5432/restore_check" /w/backup.dump

      - name: Pastikan tabel hasil pemulihan ada
        env:
          PGPASSWORD: postgres
        run: |
          COUNT=$(psql -h localhost -U postgres -d restore_check -t -c "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "Tabel hasil pemulihan: $COUNT"
          test "$COUNT" -gt 0
