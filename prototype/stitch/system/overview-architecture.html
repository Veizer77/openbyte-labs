<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #18181A">
    <div
      data-pencil-name="System / 00 - Overview &amp; Architecture"
      class="box-border w-[2000px] h-[420px] flex flex-row gap-[40px] p-[48px] justify-start items-center bg-[#18181A] rounded-[24px] overflow-hidden"
    >
      <div
        data-pencil-name="Title Column"
        class="box-border w-[1050px] shrink-0 h-fit flex flex-col gap-[16px] justify-start items-start"
      >
        <div
          data-pencil-name="Badge"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] p-[6px_16px] justify-start items-center bg-[#242427] rounded-[9999px]"
        >
          <div
            data-pencil-name="Pulse"
            class="box-border w-[8px] shrink-0 h-[8px] bg-[#82B440] rounded-[50%]"
          ></div>
          <div
            data-pencil-name="Badge Label"
            class="text-[12px]/[normal] box-border text-[#D2D88F] font-[Inter,system-ui,sans-serif] font-semibold tracking-[0.5px] text-left [white-space:nowrap]"
          >
            OPENBYTE LABS • DESIGN SYSTEM &amp; PRODUCTION CATALOG v1.1
          </div>
        </div>
        <div
          data-pencil-name="Main Title"
          class="text-[44px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-bold tracking-[-1px] text-left [white-space:nowrap]"
        >
          Muhammad Izzat Farahidi
        </div>
        <div
          data-pencil-name="Subtitle"
          class="text-[16px]/[24px] box-border text-[#a8a8ad] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
        >
          Software Engineer &amp; System Specialist — High-Performance Web, Mobile &amp;
          Multi-Tenant Architecture
        </div>
        <div
          data-pencil-name="Stats Row"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[16px] p-[8px_0px_0px_0px] justify-start items-start"
        >
          <div
            data-pencil-name="Fidelity Production"
            class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] p-[10px_16px] justify-start items-start bg-[#242427] rounded-[12px]"
          >
            <div
              data-pencil-name="Stat Value"
              class="text-[16px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              13 Screens
            </div>
            <div
              data-pencil-name="Stat Label"
              class="text-[11px]/[normal] box-border text-[#a8a8ad] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
            >
              Fidelity Production
            </div>
          </div>
          <div
            data-pencil-name="Dual-Surface Bento"
            class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] p-[10px_16px] justify-start items-start bg-[#242427] rounded-[12px]"
          >
            <div
              data-pencil-name="Stat Value"
              class="text-[16px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              MoveIQ
            </div>
            <div
              data-pencil-name="Stat Label"
              class="text-[11px]/[normal] box-border text-[#a8a8ad] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
            >
              Dual-Surface Bento
            </div>
          </div>
          <div
            data-pencil-name="Audit-Proof Code"
            class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] p-[10px_16px] justify-start items-start bg-[#242427] rounded-[12px]"
          >
            <div
              data-pencil-name="Stat Value"
              class="text-[16px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              99.98% SLA
            </div>
            <div
              data-pencil-name="Stat Label"
              class="text-[11px]/[normal] box-border text-[#a8a8ad] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
            >
              Audit-Proof Code
            </div>
          </div>
          <div
            data-pencil-name="Filament CMS Engine"
            class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] p-[10px_16px] justify-start items-start bg-[#242427] rounded-[12px]"
          >
            <div
              data-pencil-name="Stat Value"
              class="text-[16px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              Laravel 13
            </div>
            <div
              data-pencil-name="Stat Label"
              class="text-[11px]/[normal] box-border text-[#a8a8ad] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
            >
              Filament CMS Engine
            </div>
          </div>
        </div>
      </div>
      <div
        data-pencil-name="Logo Card"
        class="box-border w-[780px] shrink-0 h-[324px] flex flex-row gap-[32px] p-[32px] justify-center items-center bg-[#242427] rounded-[16px]"
      >
        <div
          data-pencil-name="Square Icon"
          class="box-border w-[240px] shrink-0 h-[240px] bg-[url('../assets/img/5f9e6a2ac345b8dc.png')] bg-no-repeat bg-cover bg-center rounded-[28px]"
        ></div>
        <div
          data-pencil-name="Logo Light Card"
          class="box-border w-[480px] shrink-0 h-[140px] flex flex-row gap-0 p-[16px_24px] justify-center items-center bg-[#FFFFFF] rounded-[20px]"
        >
          <div
            data-pencil-name="Official Brand Logo"
            class="box-border w-[385px] shrink-0 h-[100px] bg-[url('../assets/img/OpenByte%20Labs%20Tech%20Logo-1.png')] bg-no-repeat bg-contain bg-center"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
