<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5EEA4"/>
      <stop offset="100%" stop-color="#B8C062"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bentoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Bento Square Icon Container (1:1 aspect ratio) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#darkBg)" stroke="#2C2C32" stroke-width="3" filter="url(#bentoShadow)"/>

  <!-- High-Tech Blueprint Architectural Grid Lines -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#222227" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="48" y1="256" x2="464" y2="256" stroke="#222227" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1D1D22" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Central Scientific Lab Beaker + Open Code Bracket Emblem -->
  <!-- Flask Lip / Collar -->
  <path d="M 226 128 L 286 128" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Precision Glassware Outline -->
  <path d="M 240 128 L 240 178 L 176 294 C 154 332 180 376 224 376 L 288 376 C 332 376 358 332 336 294 L 272 178 L 272 128" 
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Quantum Data Orbit at Beaker Base -->
  <ellipse cx="256" cy="376" rx="104" ry="24" fill="none" stroke="url(#limeGrad)" stroke-width="5" stroke-dasharray="14 10" opacity="0.9"/>

  <!-- Code Angle Brackets (< >) inside the research core -->
  <!-- Left Bracket < in Brand Lime -->
  <path d="M 222 242 L 200 274 L 222 306" fill="none" stroke="url(#limeGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Bracket > in Brand Lime -->
  <path d="M 290 242 L 312 274 L 290 306" fill="none" stroke="url(#limeGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Quantum Catalyst / Byte Particles inside Flask -->
  <circle cx="256" cy="248" r="12" fill="#FFFFFF" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="316" r="9" fill="url(#limeGrad)"/>
  <circle cx="224" cy="326" r="6.5" fill="#D2D88F" opacity="0.85"/>
  <circle cx="288" cy="326" r="6.5" fill="#D2D88F" opacity="0.85"/>

  <!-- Technical Corner Registration Crosshairs (Minimalist Precision UI) -->
  <g stroke="#3A3A42" stroke-width="2" stroke-linecap="round">
    <!-- Top-Left Mark -->
    <line x1="72" y1="84" x2="88" y2="84"/>
    <line x1="80" y1="76" x2="80" y2="92"/>
    <!-- Top-Right Mark -->
    <line x1="424" y1="84" x2="440" y2="84"/>
    <line x1="432" y1="76" x2="432" y2="92"/>
    <!-- Bottom-Left Mark -->
    <line x1="72" y1="428" x2="88" y2="428"/>
    <line x1="80" y1="420" x2="80" y2="436"/>
    <!-- Bottom-Right Mark -->
    <line x1="424" y1="428" x2="440" y2="428"/>
    <line x1="432" y1="420" x2="432" y2="436"/>
  </g>
</svg>